<!doctype html>
<meta charset="utf-8">
<script src="wasmer-wasi.js"></script>
<script src="wasmer-wasmfs.js"></script>
<script>
"use strict";

const encoder = new TextEncoder();

function bytesToBase64(bytes) {
  let binary = "";
  for (let offset = 0; offset < bytes.length; offset += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
  }
  return btoa(binary);
}

function base64ToBytes(value) {
  const binary = atob(value);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index++) {
    bytes[index] = binary.charCodeAt(index);
  }
  return bytes;
}

function ensureDirectory(fs, path) {
  try {
    fs.mkdirSync(path, { recursive: true });
  } catch (error) {
    if (!fs.statSync(path).isDirectory()) throw error;
  }
}

function collectFiles(fs, directory, prefix, result) {
  for (const name of fs.readdirSync(directory)) {
    if (directory === "/" && name === "dev") continue;
    const path = directory === "/" ? `/${name}` : `${directory}/${name}`;
    const relative = prefix ? `${prefix}/${name}` : name;
    const stat = fs.lstatSync(path);
    if (stat.isSymbolicLink()) continue;
    if (stat.isDirectory()) {
      result.directories.push(relative);
      collectFiles(fs, path, relative, result);
    } else if (stat.isFile()) {
      const content = fs.readFileSync(path);
      result.files.push({ path: relative, data: bytesToBase64(content) });
      result.size += content.length;
      if (result.size > 32 * 1024 * 1024) {
        throw new Error("WASM output files exceed the 32 MiB transfer limit");
      }
    }
  }
}

window.runWasm = async function (input) {
  let status = 0;
  let errorText = "";
  let stdout = "";
  let stderr = "";
  let files = { directories: [], files: [], size: 0 };
  try {
    const wasmFs = new WasmFs();
    const fs = wasmFs.fs;
    ensureDirectory(fs, input.cwd);
    for (const directory of input.directories) {
      ensureDirectory(fs, `${input.cwd}/${directory}`);
    }
    for (const file of input.files) {
      const path = `${input.cwd}/${file.path}`;
      ensureDirectory(fs, path.slice(0, path.lastIndexOf("/")));
      fs.writeFileSync(path, base64ToBytes(file.data));
    }
    if (input.stdin) fs.writeFileSync("/dev/stdin", base64ToBytes(input.stdin));

    const wasi = new WASI({
      args: input.args,
      env: input.env,
      preopens: { ".": input.cwd, "/": "/" },
      bindings: { ...WASI.defaultBindings, fs },
    });
    const module = new WebAssembly.Module(base64ToBytes(input.module));
    const instance = new WebAssembly.Instance(module, wasi.getImports(module));
    try {
      wasi.start(instance);
    } catch (error) {
      if (error instanceof WASI.WASIExitError) status = error.code;
      else throw error;
    }
    stdout = bytesToBase64(fs.readFileSync("/dev/stdout"));
    stderr = bytesToBase64(fs.readFileSync("/dev/stderr"));
    collectFiles(fs, input.cwd, "", files);
  } catch (error) {
    status = Number.isInteger(error.code) ? error.code : 1;
    errorText = String(error.message || error);
  }
  window.webkit.messageHandlers.hermesWasm.postMessage({
    type: "finished",
    status,
    error: errorText,
    stdout,
    stderr,
    directories: files.directories,
    files: files.files,
  });
};

window.webkit.messageHandlers.hermesWasm.postMessage({ type: "ready" });
</script>
