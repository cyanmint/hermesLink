name: Build HermesLink

on:
  push:
  workflow_dispatch:
    inputs:
      python_runtime:
        description: Build and publish hermesrt.zip (Linux)
        required: true
        type: choice
        options: [auto, true, false]
        default: auto
      native_runtime:
        description: Build and publish HermesRuntime.framework (macOS)
        required: true
        type: choice
        options: [auto, true, false]
        default: auto
      ish_runtime:
        description: Build and publish iSH native framework (Linux)
        required: true
        type: choice
        options: [auto, true, false]
        default: auto
      app:
        description: Cross-compile HermesLink.app without runtime assets (Linux)
        required: true
        type: choice
        options: [auto, true, false]
        default: auto
      run_tests:
        description: Run simulator tests; Copilot E2E runs after IPA upload
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

# Components share one mutable release tag. Serialize runs so assets cannot be
# replaced while another run is assembling an IPA from that release.
concurrency:
  group: hermeslink-${{ github.ref }}
  cancel-in-progress: false

env:
  HERMES_RUNTIME_RELEASE_TAG: hermesrt-latest

jobs:
  decide:
    name: Decide build stages
    runs-on: ubuntu-latest
    outputs:
      run_python_runtime: ${{ steps.decision.outputs.run_python_runtime }}
      run_native_runtime: ${{ steps.decision.outputs.run_native_runtime }}
      run_ish_meson: ${{ steps.decision.outputs.run_ish_meson }}
      run_ish_runtime: ${{ steps.decision.outputs.run_ish_runtime }}
      run_app: ${{ steps.decision.outputs.run_app }}
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed components
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PYTHON_RUNTIME_OVERRIDE: ${{ inputs.python_runtime || 'auto' }}
          NATIVE_RUNTIME_OVERRIDE: ${{ inputs.native_runtime || 'auto' }}
          ISH_RUNTIME_OVERRIDE: ${{ inputs.ish_runtime || 'auto' }}
          APP_OVERRIDE: ${{ inputs.app || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed_files=''
          else
            # Use the files listed in this push event. This covers every commit
            # included in the push, rather than inspecting only HEAD^.
            changed_files="$(jq -r '.commits[]? | (.added[]?, .modified[]?, .removed[]?)' "$EVENT_PATH")"
            # GitHub may omit the commit list for an unusually large push.
            # In that case, compare the push's before/after range, not one commit.
            if [ -z "$changed_files" ] && [ -n "$BEFORE_SHA" ] && \
               [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" 2>/dev/null || \
                git diff --name-only HEAD^ HEAD)"
            fi
          fi

          python_runtime_changed=false
          native_runtime_changed=false
          ish_meson_changed=false
          ish_framework_changed=false
          app_changed=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              scripts/hermes/build/build-hermesrt-zip.sh|scripts/hermes/build/fetch-sources.sh|scripts/hermes/build/validate-runtime-zip.py|hermes/overlay/*|modules/hermes-agent|modules/hermes-webui|modules/cpython)
                python_runtime_changed=true
                ;;
            esac
            case "$path" in
              scripts/hermes/build/build-native-ios.sh|scripts/hermes/build/package-native-ios.sh|hermes/overlay/cpython/*|hermes/overlay/patches/patch-cpython-ios-system.py|scripts/hermes/build/generate-native-module-registry.py|scripts/hermes/build/configure_native_modules.py|modules/cpython|modules/openssl)
                native_runtime_changed=true
                ;;
            esac
            case "$path" in
              scripts/hermes/build/build-ish-static.sh|scripts/hermes/build/fetch-ish-source.sh|scripts/hermes/build/verify-ish-source.py|scripts/hermes/build/patch-ish-pty.py|scripts/hermes/build/patch-ish-documents-fs.py|scripts/hermes/build/ish-documents-fs.c|modules/ish)
                ish_meson_changed=true
                ;;
            esac
            case "$path" in
              scripts/hermes/build/prepare-ish-xcode-project.py|scripts/hermes/build/repack-ish-meson-archives.py|scripts/hermes/build/build-ish-host-libs.sh|scripts/hermes/build/package-ish-framework.sh|ishbridge/ISHNative.xcconfig|ishbridge/*)
                ish_framework_changed=true
                ;;
            esac
            case "$path" in
              blink/*|scripts/blink/*|modules/blink|ishbridge/ISHNative.xcconfig|ishbridge/*|scripts/install_ish_runtime.sh|scripts/install_hermes_runtime.sh)
                app_changed=true
                ;;
            esac
            if [[ "$path" == .github/workflows/build.yml ]]; then
              app_changed=true
            fi
          done <<< "$changed_files"

          # Build missing release components once when bootstrapping this flow.
          if ! release_assets="$(gh release view "$HERMES_RUNTIME_RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            release_assets=''
          fi
          has_asset() { printf '%s\n' "$release_assets" | grep -Fxq "$1"; }
          has_asset hermesrt.zip || python_runtime_changed=true
          has_asset HermesRuntime.framework.zip || native_runtime_changed=true
          has_asset ISHMesonBuild.tar.gz || ish_meson_changed=true
          has_asset ISHLinuxNative.zip || ish_framework_changed=true
          if has_asset ISHLinuxNative.zip; then
            mkdir -p "$RUNNER_TEMP/ish-release-check"
            if gh release download "$HERMES_RUNTIME_RELEASE_TAG" \
              --pattern ISHLinuxNative.zip \
              --dir "$RUNNER_TEMP/ish-release-check"; then
              if ! unzip -Z1 "$RUNNER_TEMP/ish-release-check/ISHLinuxNative.zip" |
                grep -Fxq Resources/ish-rootfs.tar.gz; then
                ish_framework_changed=true
              fi
            else
              ish_framework_changed=true
            fi
          fi
          has_asset HermesLink.app.zip || app_changed=true

          choose() {
            case "$1" in
              true) printf 'true' ;;
              false) printf 'false' ;;
              auto) printf '%s' "$2" ;;
              *) echo "invalid override: $1" >&2; exit 2 ;;
            esac
          }
          run_python_runtime="$(choose "$PYTHON_RUNTIME_OVERRIDE" "$python_runtime_changed")"
          run_native_runtime="$(choose "$NATIVE_RUNTIME_OVERRIDE" "$native_runtime_changed")"
          run_ish_meson="$(choose "$ISH_RUNTIME_OVERRIDE" "$ish_meson_changed")"
          ish_framework_auto="$ish_framework_changed"
          if [ "$run_ish_meson" = true ]; then
            ish_framework_auto=true
          fi
          run_ish_runtime="$(choose "$ISH_RUNTIME_OVERRIDE" "$ish_framework_auto")"
          if [ "$run_ish_runtime" = true ]; then
            app_changed=true
          fi
          run_app="$(choose "$APP_OVERRIDE" "$app_changed")"
          printf 'python_runtime_changed=%s native_runtime_changed=%s ish_meson_changed=%s ish_framework_changed=%s app_changed=%s\n' \
            "$python_runtime_changed" "$native_runtime_changed" "$ish_meson_changed" "$ish_framework_changed" "$app_changed"
          printf 'run_python_runtime=%s\n' "$run_python_runtime" >> "$GITHUB_OUTPUT"
          printf 'run_native_runtime=%s\n' "$run_native_runtime" >> "$GITHUB_OUTPUT"
          printf 'run_ish_meson=%s\n' "$run_ish_meson" >> "$GITHUB_OUTPUT"
          printf 'run_ish_runtime=%s\n' "$run_ish_runtime" >> "$GITHUB_OUTPUT"
          printf 'run_app=%s\n' "$run_app" >> "$GITHUB_OUTPUT"
          printf 'run_python_runtime=%s run_native_runtime=%s run_ish_meson=%s run_ish_runtime=%s run_app=%s\n' \
            "$run_python_runtime" "$run_native_runtime" "$run_ish_meson" "$run_ish_runtime" "$run_app"

  prepare-release:
    name: Ensure runtime release exists
    needs: decide
    if: needs.decide.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Create fixed release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$HERMES_RUNTIME_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$HERMES_RUNTIME_RELEASE_TAG" \
              --title 'HermesLink build components (latest)' \
              --notes 'Build components used to assemble HermesLink.ipa.'
          fi

  build-runtime-zip:
    name: Build pure-Python hermesrt.zip (Linux)
    needs: [decide, prepare-release]
    if: needs.decide.outputs.run_python_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Initialize pinned Hermes build sources
        run: git submodule update --init --depth 1 -- modules/cpython modules/hermes-agent modules/hermes-webui

      - name: Set up host Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Build and validate pure-Python runtime archive
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/python-runtime
        run: |
          set -euo pipefail
          chmod +x scripts/hermes/build/*.sh
          bash scripts/hermes/build/build-hermesrt-zip.sh
          test -s hermes/hermesrt.zip
          python3 scripts/hermes/build/validate-runtime-zip.py hermes/hermesrt.zip

      - name: Publish hermesrt.zip to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$HERMES_RUNTIME_RELEASE_TAG" hermes/hermesrt.zip --clobber

  build-native-runtime:
    name: Build native iOS runtime (Linux cross-compile)
    needs: [decide, prepare-release]
    if: needs.decide.outputs.run_native_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Initialize pinned native runtime sources
        run: git submodule update --init --depth 1 -- modules/cpython modules/openssl

      - name: Install Linux iOS cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Set up host Python
        id: host-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Cache Hermes compilation
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hermes-build/native-ios
          key: ${{ runner.os }}-hermes-ios-${{ hashFiles('scripts/hermes/build/**') }}-${{ hashFiles('hermes/overlay/**') }}-${{ hashFiles('hermes/patches/**') }}
          restore-keys: |
            ${{ runner.os }}-hermes-ios-

      - name: Build native iOS runtime only
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
          HERMES_BUILD_RUNTIME_ZIP: '0'
          JOBS: 4
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
        run: |
          set -euo pipefail
          chmod +x scripts/hermes/build/*.sh
          bash scripts/hermes/build/build-native-ios.sh
          test -x hermes/Frameworks/HermesRuntime.framework/HermesRuntime

      - name: Package native framework
        run: |
          set -euo pipefail
          (cd hermes/Frameworks && \
            zip -qry "$GITHUB_WORKSPACE/hermes/HermesRuntime.framework.zip" HermesRuntime.framework)
          unzip -t hermes/HermesRuntime.framework.zip

      - name: Publish HermesRuntime.framework.zip to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$HERMES_RUNTIME_RELEASE_TAG" hermes/HermesRuntime.framework.zip --clobber

  build-ish-meson:
    name: Cross-compile iSH Meson archives (Linux)
    needs: [decide, prepare-release]
    if: needs.decide.outputs.run_ish_meson == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Initialize pinned iSH source tree
        run: git submodule update --init --recursive --checkout --depth 1 -- modules/ish

      - name: Install Linux iOS cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build curl rsync

      - name: Fetch pinned iSH source and Alpine rootfs
        run: |
          set -euo pipefail
          chmod +x scripts/hermes/build/*.sh
          bash scripts/hermes/build/fetch-ish-source.sh /tmp/hermeslink-ish

      - name: Cache iSH Meson build
        uses: actions/cache@v6
        with:
          path: /tmp/hermeslink-ish/build
          key: ${{ runner.os }}-hermes-ish-meson-ios16.5-${{ hashFiles('scripts/hermes/build/**') }}

      - name: Build iSH Meson archives
        env:
          BUILD_ROOT: /tmp/hermeslink-ish/build
          MESON_BUILD_DIR: /tmp/hermeslink-ish/build/meson
          ISH_SOURCE: /tmp/hermeslink-ish/source
          IOS_SDK_VERSION: '16.5'
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
        run: bash scripts/hermes/build/build-ish-static.sh --meson-only

      - name: Package Linux iSH build for the macOS stage
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/ISHMesonBuild.tar.gz" \
            -C /tmp/hermeslink-ish \
            build/meson build/ios-toolchain build/sdks source
          tar -tzf "$RUNNER_TEMP/ISHMesonBuild.tar.gz" >/dev/null

      - name: Publish Linux iSH build to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$HERMES_RUNTIME_RELEASE_TAG" "$RUNNER_TEMP/ISHMesonBuild.tar.gz" --clobber

  build-ish-runtime:
    name: Build iSH native framework (Linux cross-compile)
    needs: [decide, prepare-release, build-ish-meson]
    if: >-
      always() &&
      needs.decide.outputs.run_ish_runtime == 'true' &&
      needs.prepare-release.result == 'success' &&
      (needs.build-ish-meson.result == 'success' ||
       (needs.build-ish-meson.result == 'skipped' && needs.decide.outputs.run_ish_meson != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Install Linux iOS cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm meson ninja-build

      - name: Install Apple arm64 linker
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ish-linker
          create-args: >-
            cctools_osx-arm64=1030.6.3
            ld64_osx-arm64=956.6

      - name: Initialize pinned iSH source tree
        run: git submodule update --init --recursive --checkout --depth 1 -- modules/ish

      - name: Download Linux iSH build from fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermeslink-ish
          gh release download "$HERMES_RUNTIME_RELEASE_TAG" \
            --pattern ISHMesonBuild.tar.gz \
            --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/ISHMesonBuild.tar.gz" -C /tmp/hermeslink-ish
          test -x /tmp/hermeslink-ish/build/ios-toolchain/clang
          test -f /tmp/hermeslink-ish/source/.hermeslink-source-revision

      - name: Build iSH host-interop libraries and Mach-O section anchors
        env:
          BUILD_ROOT: /tmp/hermeslink-ish/build
          MESON_BUILD_DIR: /tmp/hermeslink-ish/build/meson
          ISH_SOURCE: /tmp/hermeslink-ish/source
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
        run: bash scripts/hermes/build/build-ish-static.sh --framework-only

      - name: Verify Linux-built Mach-O section anchors
        run: test -s hermes/build/external/ish/lib/ish-sections.o

      - name: Package iSH dynamic framework
        shell: micromamba-shell {0}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
          SDKROOT: /tmp/hermeslink-ish/build/sdks/iPhoneOS16.5.sdk
          CC: /usr/bin/clang
        run: |
          set -euo pipefail
          shopt -s nullglob
          linker_candidates=("$CONDA_PREFIX"/bin/arm64-apple-darwin*-ld)
          if [ "${#linker_candidates[@]}" -ne 1 ] || [ ! -x "${linker_candidates[0]}" ]; then
            printf 'expected one executable arm64 cctools ld64, found %s\n' "${#linker_candidates[@]}" >&2
            printf '  %s\n' "${linker_candidates[@]}" >&2
            exit 2
          fi
          export LD64="${linker_candidates[0]}"
          test -x "$LD64"
          mkdir -p "$RUNNER_TEMP/ish-native-package/Frameworks"
          bash scripts/hermes/build/package-ish-framework.sh \
            hermes/build/external/ish/lib \
            "$RUNNER_TEMP/ish-native-package/Frameworks"
          mkdir -p "$RUNNER_TEMP/ish-native-package/Resources"
          bash scripts/hermes/build/fetch-ish-source.sh --rootfs-only \
            "$RUNNER_TEMP/ish-native-package/Resources/ish-rootfs.tar.gz"

      - name: Verify Linux-linked iSH framework
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/ish-native-package/Frameworks/Ish.framework/Ish"
          test -s "$binary"
          file "$binary"
          llvm-nm --undefined-only "$binary" > "$RUNNER_TEMP/ish-undefined-symbols.txt"
          if grep -E 'section\$(start|end)\$|segment\$(start|end)\$' \
            "$RUNNER_TEMP/ish-undefined-symbols.txt"; then
            echo 'unresolved Mach-O section-boundary symbols remain' >&2
            exit 1
          fi
          llvm-nm --defined-only "$binary" > "$RUNNER_TEMP/ish-defined-symbols.txt"
          for symbol in _ish_configure _ish_configure_documents _ish_run_command; do
            grep -Fq " $symbol" "$RUNNER_TEMP/ish-defined-symbols.txt" || {
              echo "missing public iSH framework export: $symbol" >&2
              exit 1
            }
          done

      - name: Package iSH native build output
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/ish-native-package" && zip -qry "$GITHUB_WORKSPACE/ISHLinuxNative.zip" Frameworks Resources)
          unzip -t ISHLinuxNative.zip

      - name: Publish ISHLinuxNative.zip to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$HERMES_RUNTIME_RELEASE_TAG" ISHLinuxNative.zip --clobber

  build-app:
    name: Cross-compile HermesLink app without runtime assets (Linux)
    needs: [decide, prepare-release]
    if: needs.decide.outputs.run_app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Install Linux Xcode-project build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git gnupg libedit2 libncurses6 libpng-dev libsqlite3-0 libxml2-dev libz3-4 make ninja-build pkg-config rsync unzip zip zlib1g-dev

      - name: Install Swift 5.8 toolchain
        run: |
          set -euo pipefail
          version=5.8
          archive="$RUNNER_TEMP/swift-${version}-RELEASE-ubuntu22.04.tar.gz"
          base="https://download.swift.org/swift-${version}-release/ubuntu2204/swift-${version}-RELEASE"
          curl --fail --location --retry 5 "$base/swift-${version}-RELEASE-ubuntu22.04.tar.gz" -o "$archive"
          curl --fail --location --retry 5 "$base/swift-${version}-RELEASE-ubuntu22.04.tar.gz.sig" -o "$archive.sig"
          curl --fail --location --retry 5 https://swift.org/keys/release-key-swift-5.x.asc -o "$RUNNER_TEMP/swift-release-key.asc"
          python3 - "$RUNNER_TEMP/swift-release-key.asc" <<'PY'
          import subprocess
          import sys

          key_info = subprocess.check_output(
              ["gpg", "--show-keys", "--with-colons", sys.argv[1]], text=True
          )
          fingerprints = [
              line.split(":")[9]
              for line in key_info.splitlines()
              if line.startswith("fpr:")
          ]
          if "A62AE125BBBFBB96A6E042EC925CC1CCED3D1561" not in fingerprints:
              raise SystemExit(f"unexpected Swift signing key fingerprint: {fingerprints}")
          PY
          gpg --import "$RUNNER_TEMP/swift-release-key.asc"
          gpg --verify "$archive.sig" "$archive"
          toolchain="$RUNNER_TEMP/swift-${version}"
          mkdir -p "$toolchain"
          tar -xzf "$archive" --strip-components=1 -C "$toolchain"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
          "$toolchain/usr/bin/swiftc" --version

      - name: Initialize and stage Blink source
        run: |
          set -euo pipefail
          git submodule update --init --recursive --depth 1 -- modules/blink
          bash scripts/blink/prepare-blink-source.sh modules/blink "$GITHUB_WORKSPACE"

      - name: Resolve Blink framework package artifacts
        continue-on-error: true
        env:
          SWIFTPM_MAX_CONCURRENT_OPERATIONS: '1'
        run: |
          set -o pipefail
          cd xcfs
          swift package resolve 2>&1 | tee "$RUNNER_TEMP/swift-package-resolve.log"

      - name: Get Blink resources
        run: bash get_resources.sh

      - name: Install Theos iPhoneOS SDK
        run: |
          set -euo pipefail
          git clone --filter=blob:none --sparse --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          git -C "$RUNNER_TEMP/theos-sdks" sparse-checkout set iPhoneOS16.5.sdk
          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk/usr/include"
          echo "SDKROOT=$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: Install Apple arm64 Mach-O linker
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: linux-ios-app-linker
          create-args: >-
            cctools_osx-arm64=1030.6.3
            ld64_osx-arm64=956.6

      - name: Prepare runtime framework link placeholders
        shell: micromamba-shell {0}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          linker_candidates=("$CONDA_PREFIX"/bin/arm64-apple-darwin*-ld)
          if [ "${#linker_candidates[@]}" -ne 1 ] || [ ! -x "${linker_candidates[0]}" ]; then
            printf 'expected one executable arm64 cctools ld64, found %s\n' "${#linker_candidates[@]}" >&2
            exit 2
          fi
          LD64="${linker_candidates[0]}"
          mkdir -p Frameworks/HermesRuntime.framework Frameworks/Ish.framework/Headers Resources
          cat > "$RUNNER_TEMP/hermes_runtime_stub.c" <<'EOF'
          int hermes_runtime_main(int argc, char **argv) {
            (void)argc;
            (void)argv;
            return 70;
          }
          EOF
          clang -target arm64-apple-ios16.1 -isysroot "$SDKROOT" \
            -c "$RUNNER_TEMP/hermes_runtime_stub.c" -o "$RUNNER_TEMP/hermes_runtime_stub.o"
          "$LD64" -arch arm64 -platform_version ios 16.1 16.5 -syslibroot "$SDKROOT" \
            -dylib -install_name '@rpath/HermesRuntime.framework/HermesRuntime' \
            -o Frameworks/HermesRuntime.framework/HermesRuntime "$RUNNER_TEMP/hermes_runtime_stub.o" -lSystem
          cat > Frameworks/HermesRuntime.framework/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HermesRuntime</string>
            <key>CFBundleIdentifier</key><string>com.cyan.hermes-runtime-link-stub</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
          </dict></plist>
          EOF
          clang -target arm64-apple-ios16.1 -isysroot "$SDKROOT" -D_DARWIN_C_SOURCE=1 \
            -I ISHBridge -c ISHBridge/ish_kernel_bridge_stub.m -o "$RUNNER_TEMP/ish_kernel_bridge_stub.o"
          clang -target arm64-apple-ios16.1 -isysroot "$SDKROOT" -D_DARWIN_C_SOURCE=1 \
            -I ISHBridge -c ISHBridge/ish_rootfs.c -o "$RUNNER_TEMP/ish_rootfs.o"
          clang -target arm64-apple-ios16.1 -isysroot "$SDKROOT" -D_DARWIN_C_SOURCE=1 \
            -I ISHBridge -c ISHBridge/ish_path_safety.c -o "$RUNNER_TEMP/ish_path_safety.o"
          clang -target arm64-apple-ios16.1 -isysroot "$SDKROOT" -D_DARWIN_C_SOURCE=1 \
            -I ISHBridge -c ISHBridge/ish_exit_protocol.c -o "$RUNNER_TEMP/ish_exit_protocol.o"
          "$LD64" -arch arm64 -platform_version ios 16.1 16.5 -syslibroot "$SDKROOT" \
            -L "$SDKROOT/usr/lib" -dylib -install_name '@rpath/Ish.framework/Ish' \
            -o Frameworks/Ish.framework/Ish "$RUNNER_TEMP/ish_kernel_bridge_stub.o" \
            "$RUNNER_TEMP/ish_rootfs.o" "$RUNNER_TEMP/ish_path_safety.o" \
            "$RUNNER_TEMP/ish_exit_protocol.o" -lsqlite3 -lz -lSystem
          cp ISHBridge/ish_kernel_bridge.h Frameworks/Ish.framework/Headers/
          cat > Frameworks/Ish.framework/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Ish</string>
            <key>CFBundleIdentifier</key><string>com.cyan.ish-link-stub</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
          </dict></plist>
          EOF
          printf 'runtime omitted from app component\n' > "$RUNNER_TEMP/runtime-stub.txt"
          (cd "$RUNNER_TEMP" && zip -q "$GITHUB_WORKSPACE/Resources/hermesrt.zip" runtime-stub.txt)
          tar -czf Resources/ish-rootfs.tar.gz --files-from /dev/null

      - name: Prepare Xcode configuration
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          printf '\nISH_NATIVE_AVAILABLE = YES\n' >> developer_setup.xcconfig

      - name: Restore Linux xcbuild toolchain cache
        id: xcbuild_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/xcbuild
          key: ${{ runner.os }}-xcbuild-dbaee552d2f13640773eb1ad3c79c0d2aca7229c-${{ hashFiles('scripts/blink/patch-xcbuild-linux.py', 'scripts/blink/linux-ios-product-types.xcspec') }}-swift5.8-clang-flags-v1

      - name: Build xcbuild on Linux
        id: build_xcbuild
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/xcbuild/.git" ]; then
            git clone --no-checkout https://github.com/facebookarchive/xcbuild.git "$RUNNER_TEMP/xcbuild"
          fi
          git -C "$RUNNER_TEMP/xcbuild" checkout dbaee552d2f13640773eb1ad3c79c0d2aca7229c
          git -C "$RUNNER_TEMP/xcbuild" submodule update --init --recursive
          python3 - "$RUNNER_TEMP/xcbuild" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          compatibility_includes = (
              ("Libraries/libutil/Headers/libutil/Permissions.h", "#include <bitset>\n", "#include <cstdint>\n"),
              ("Libraries/plist/Sources/Format/Encoding.cpp", "#include <cassert>\n", "#include <cstdlib>\n"),
          )
          for relative_path, anchor, include in compatibility_includes:
              source = root / relative_path
              contents = source.read_text(encoding="utf-8")
              if include not in contents:
                  if contents.count(anchor) != 1:
                      raise SystemExit(f"unexpected xcbuild source layout: {source}")
                  source.write_text(contents.replace(anchor, include + anchor, 1), encoding="utf-8")
          PY
          python3 scripts/blink/patch-xcbuild-linux.py "$RUNNER_TEMP/xcbuild"
          CC=clang CXX=clang++ \
            CXXFLAGS='-Wno-error=deprecated-declarations -Wno-error=address-of-packed-member -Wno-error=range-loop-construct -Wno-error=self-assign-field -include cstdint -include cstdlib' \
            CMAKE_FLAGS='-DCMAKE_POLICY_VERSION_MINIMUM=3.5' \
            make -C "$RUNNER_TEMP/xcbuild" -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/xcbuild-build.log"
          test -x "$RUNNER_TEMP/xcbuild/build/xcbuild"
          echo "$RUNNER_TEMP/xcbuild/build" >> "$GITHUB_PATH"

      - name: Save Linux xcbuild toolchain cache
        if: always() && steps.build_xcbuild.outcome == 'success' && steps.xcbuild_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/xcbuild
          key: ${{ runner.os }}-xcbuild-dbaee552d2f13640773eb1ad3c79c0d2aca7229c-${{ hashFiles('scripts/blink/patch-xcbuild-linux.py', 'scripts/blink/linux-ios-product-types.xcspec') }}-swift5.8-clang-flags-v1

      - name: Stage Linux Xcode developer directory
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/linux-xcode-dev" "$SDKROOT" "$RUNNER_TEMP/xcbuild/Specifications" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          root, sdk, specifications = map(Path, sys.argv[1:])
          platform = root / "Platforms/iPhoneOS.platform"
          (platform / "Developer/SDKs").mkdir(parents=True)
          (platform / "Developer/Library/Xcode").mkdir(parents=True)
          (root / "Library/Xcode").mkdir(parents=True)
          info = {
              "Identifier": "com.apple.platform.iphoneos",
              "Name": "iphoneos",
              "Description": "iOS",
              "Type": "Platform",
              "Version": "16.5",
              "FamilyIdentifier": "iOS",
              "FamilyName": "iOS",
              "IsDeploymentPlatform": True,
          }
          (platform / "Info.plist").write_bytes(plistlib.dumps(info))
          (platform / "Developer/SDKs/iPhoneOS16.5.sdk").symlink_to(sdk, target_is_directory=True)
          (platform / "Developer/Library/Xcode/Specifications").symlink_to(specifications, target_is_directory=True)
          (root / "Library/Xcode/Specifications").symlink_to(specifications, target_is_directory=True)
          PY
          echo "DEVELOPER_DIR=$RUNNER_TEMP/linux-xcode-dev" >> "$GITHUB_ENV"

      - name: Cross-compile Blink Xcode project on Linux
        shell: micromamba-shell {0}
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
        run: |
          set -o pipefail
          shopt -s nullglob
          linker_candidates=("$CONDA_PREFIX"/bin/arm64-apple-darwin*-ld)
          if [ "${#linker_candidates[@]}" -ne 1 ] || [ ! -x "${linker_candidates[0]}" ]; then
            printf 'expected one executable arm64 cctools ld64, found %s\n' "${#linker_candidates[@]}" >&2
            printf '  %s\n' "${linker_candidates[@]}" >&2
            exit 2
          fi
          LD64="${linker_candidates[0]}"
          swift_dispatch_modulemap="$RUNNER_TEMP/swift-5.8/usr/lib/swift/dispatch/module.modulemap"
          if [ -f "$swift_dispatch_modulemap" ]; then
            mv "$swift_dispatch_modulemap" "$swift_dispatch_modulemap.linux-disabled"
            trap 'mv "$swift_dispatch_modulemap.linux-disabled" "$swift_dispatch_modulemap"' EXIT
          fi
          xcbuild -project Blink.xcodeproj \
            -scheme Blink \
            -sdk "$SDKROOT" \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build-products" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            LD="$LD64" \
            build 2>&1 | tee "$RUNNER_TEMP/hermeslink-linux-xcbuild.log"

      - name: Package Linux-built app bundle
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/build-products" -mindepth 1 -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -f "$app/Info.plist"
          test -x "$app/HermesLink"
          mkdir -p "$RUNNER_TEMP/app-transfer"
          tar -czf "$RUNNER_TEMP/app-transfer/HermesLink.app.tar.gz" \
            -C "$(dirname "$app")" "$(basename "$app")"

      - name: Upload Linux-built app bundle
        uses: actions/upload-artifact@v7
        with:
          name: hermeslink-app-bundle
          path: ${{ runner.temp }}/app-transfer/HermesLink.app.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux cross-compile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermeslink-linux-xcbuild-diagnostics
          path: |
            ${{ runner.temp }}/hermeslink-linux-xcbuild.log
            ${{ runner.temp }}/xcbuild-build.log
            ${{ runner.temp }}/swift-package-resolve.log
          if-no-files-found: ignore
          retention-days: 14

  publish-app:
    name: Package and publish HermesLink app (Linux)
    needs: [decide, build-app]
    if: needs.decide.outputs.run_app == 'true' && needs.build-app.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Download app bundle from Linux compiler
        uses: actions/download-artifact@v7
        with:
          name: hermeslink-app-bundle
          path: ${{ runner.temp }}/app-transfer

      - name: Remove link-only runtime placeholders and package app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-work" "$RUNNER_TEMP/runtime-free-app"
          tar -xzf "$RUNNER_TEMP/app-transfer/HermesLink.app.tar.gz" -C "$RUNNER_TEMP/app-work"
          app="$(find "$RUNNER_TEMP/app-work" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -f "$app/Info.plist"
          test -x "$app/HermesLink"
          rm -rf "$app/Frameworks/HermesRuntime.framework" "$app/Frameworks/Ish.framework" \
            "$app/hermesrt.zip" "$app/ish-rootfs.tar.gz"
          test ! -e "$app/Frameworks/HermesRuntime.framework"
          test ! -e "$app/Frameworks/Ish.framework"
          test ! -e "$app/hermesrt.zip"
          test ! -e "$app/ish-rootfs.tar.gz"
          (
            cd "$(dirname "$app")"
            zip -q -r -X "$RUNNER_TEMP/runtime-free-app/HermesLink.app.zip" "$(basename "$app")"
          )
          unzip -tq "$RUNNER_TEMP/runtime-free-app/HermesLink.app.zip"
          if unzip -Z1 "$RUNNER_TEMP/runtime-free-app/HermesLink.app.zip" |
            grep -E 'HermesRuntime\.framework|Ish\.framework|hermesrt\.zip|ish-rootfs\.tar\.gz'; then
            echo "app component unexpectedly contains runtime assets" >&2
            exit 1
          fi

      - name: Publish runtime-free app archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$HERMES_RUNTIME_RELEASE_TAG" "$RUNNER_TEMP/runtime-free-app/HermesLink.app.zip" --clobber

  build-ish-simulator-runtime:
    name: Build iSH Simulator runtime
    needs: [assemble-ipa]
    if: inputs.run_tests == true && needs.assemble-ipa.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Install LLVM, LLD, Meson, and Ninja
        run: brew install llvm lld meson ninja

      - name: Initialize pinned iSH source tree
        run: git submodule update --init --recursive --checkout --depth 1 -- modules/ish

      - name: Fetch pinned iSH source and Alpine rootfs
        run: bash scripts/hermes/build/fetch-ish-source.sh "$RUNNER_TEMP/ish-simulator-source"

      - name: Build iSH for iOS Simulator
        env:
          BUILD_ROOT: ${{ runner.temp }}/ish-simulator-build
          ISH_SOURCE: ${{ runner.temp }}/ish-simulator-source/source
          OUTPUT_DIR: ${{ runner.temp }}/ish-simulator-build/lib
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
        run: bash scripts/hermes/build/build-ish-static.sh --simulator

      - name: Compile simulator iSH Mach-O section anchors
        run: |
          xcrun --sdk iphonesimulator clang \
            -target arm64-apple-ios16.1-simulator \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -c "$RUNNER_TEMP/ish-simulator-source/source/deps/linux/arch/ish/kernel/sections.S" \
            -o "$RUNNER_TEMP/ish-simulator-build/lib/ish-sections.o"

      - name: Package simulator iSH framework and rootfs
        env:
          SDK_NAME: iphonesimulator
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ish-simulator-runtime/Frameworks" "$RUNNER_TEMP/ish-simulator-runtime/Resources"
          bash scripts/hermes/build/package-ish-framework.sh \
            "$RUNNER_TEMP/ish-simulator-build/lib" \
            "$RUNNER_TEMP/ish-simulator-runtime/Frameworks"
          cp "$RUNNER_TEMP/ish-simulator-source/rootfs.tar.gz" \
            "$RUNNER_TEMP/ish-simulator-runtime/Resources/ish-rootfs.tar.gz"
          python3 scripts/hermes/build/verify-ish-source.py \
            --rootfs "$RUNNER_TEMP/ish-simulator-runtime/Resources/ish-rootfs.tar.gz"

      - name: Upload simulator iSH runtime
        uses: actions/upload-artifact@v7
        with:
          name: ish-simulator-runtime
          path: ${{ runner.temp }}/ish-simulator-runtime
          if-no-files-found: error
          retention-days: 1

  simulator-e2e:
    name: Simulator Copilot E2E
    needs: [assemble-ipa, build-ish-simulator-runtime]
    if: >-
      always() &&
      inputs.run_tests == true &&
      needs.assemble-ipa.result == 'success' &&
      needs.build-ish-simulator-runtime.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Initialize pinned Blink source tree
        run: git submodule update --init --recursive --depth 1 -- modules/blink

      - name: Apply Blink integration and stage app sources
        run: bash scripts/blink/prepare-blink-source.sh modules/blink "$GITHUB_WORKSPACE"

      - name: Install released runtime for simulator Copilot E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-e2e"
          gh release download "$HERMES_RUNTIME_RELEASE_TAG" \
            --pattern hermesrt.zip \
            --pattern HermesRuntime.framework.zip \
            --dir "$RUNNER_TEMP/runtime-e2e"
          python3 scripts/hermes/build/validate-runtime-zip.py "$RUNNER_TEMP/runtime-e2e/hermesrt.zip"
          unzip -t "$RUNNER_TEMP/runtime-e2e/HermesRuntime.framework.zip"
          mkdir -p hermes/Frameworks
          unzip -q "$RUNNER_TEMP/runtime-e2e/HermesRuntime.framework.zip" -d hermes/Frameworks
          cp "$RUNNER_TEMP/runtime-e2e/hermesrt.zip" hermes/hermesrt.zip
          bash scripts/install_hermes_runtime.sh hermes

      - name: Download simulator iSH framework and rootfs
        uses: actions/download-artifact@v7
        with:
          name: ish-simulator-runtime
          path: ${{ runner.temp }}/ish-simulator-runtime

      - name: Cache framework builds
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('blink/UPSTREAM_REVISION') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_frameworks.sh

      - name: Get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_resources.sh

      - name: Install native iSH for simulator app
        run: |
          set -euo pipefail
          bash scripts/install_ish_runtime.sh "$RUNNER_TEMP/ish-simulator-runtime"
          python3 scripts/hermes/build/verify-ish-source.py --rootfs Resources/ish-rootfs.tar.gz

      - name: Prepare Xcode configuration
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          printf '\nISH_NATIVE_AVAILABLE = YES\n' >> developer_setup.xcconfig

      - name: Run HermesLink tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | grep -m1 -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')"
          test -n "$simulator_id"
          set -o pipefail
          xcodebuild -project Blink.xcodeproj -scheme BlinkTests -sdk iphonesimulator -destination "id=$simulator_id" test ISH_NATIVE_AVAILABLE=NO | xcpretty

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build HermesLink simulator app
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/HermesLinkSimulatorE2E" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            IPHONEOS_DEPLOYMENT_TARGET='16.1' \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/hermeslink-simulator-e2e-build.log" | xcpretty
          app="$RUNNER_TEMP/HermesLinkSimulatorE2E/Build/Products/Debug-iphonesimulator/HermesLink.app"
          test -d "$app"
          test -s "$app/Info.plist"

      - name: Run Copilot WebUI conversation in simulator
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SIMULATOR_APP_PATH: ${{ runner.temp }}/HermesLinkSimulatorE2E/Build/Products/Debug-iphonesimulator/HermesLink.app
        run: |
          set -euo pipefail
          set -o pipefail
          python tests/hermes/ci_simulator_copilot_e2e.py 2>&1 | tee "$RUNNER_TEMP/hermeslink-simulator-copilot-e2e.log"

      - name: Upload simulator Copilot E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermeslink-simulator-copilot-e2e-logs
          path: |
            ${{ runner.temp }}/hermeslink-simulator-e2e-build.log
            ${{ runner.temp }}/hermeslink-simulator-copilot-e2e.log
          if-no-files-found: ignore
          retention-days: 14

  assemble-ipa:
    name: Assemble HermesLink IPA
    needs: [decide, prepare-release, build-runtime-zip, build-native-runtime, build-ish-meson, build-ish-runtime, build-app, publish-app]
    if: >-
      always() &&
      needs.decide.result == 'success' &&
      needs.prepare-release.result == 'success' &&
      (needs.build-runtime-zip.result == 'success' || needs.build-runtime-zip.result == 'skipped') &&
      (needs.build-native-runtime.result == 'success' || needs.build-native-runtime.result == 'skipped') &&
      (needs.build-ish-meson.result == 'success' ||
       (needs.build-ish-meson.result == 'skipped' && needs.decide.outputs.run_ish_meson != 'true')) &&
      (needs.build-ish-runtime.result == 'success' ||
       (needs.build-ish-runtime.result == 'skipped' && needs.decide.outputs.run_ish_runtime != 'true')) &&
      (needs.build-app.result == 'success' ||
       (needs.build-app.result == 'skipped' && needs.decide.outputs.run_app != 'true'))
      &&
      (needs.publish-app.result == 'success' ||
       (needs.publish-app.result == 'skipped' && needs.decide.outputs.run_app != 'true'))
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Download app and runtime components from fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermeslink-components/app" "$RUNNER_TEMP/Payload"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${HERMES_RUNTIME_RELEASE_TAG}"
          for asset in HermesLink.app.zip HermesRuntime.framework.zip hermesrt.zip ISHLinuxNative.zip; do
            curl --fail --location --retry 5 --retry-all-errors \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/octet-stream' \
              --output "$RUNNER_TEMP/hermeslink-components/$asset" \
              "$release_url/$asset"
            test -s "$RUNNER_TEMP/hermeslink-components/$asset"
          done
          unzip -t "$RUNNER_TEMP/hermeslink-components/HermesLink.app.zip"
          python3 scripts/hermes/build/validate-runtime-zip.py "$RUNNER_TEMP/hermeslink-components/hermesrt.zip"
          unzip -t "$RUNNER_TEMP/hermeslink-components/HermesRuntime.framework.zip"
          unzip -t "$RUNNER_TEMP/hermeslink-components/ISHLinuxNative.zip"
          ditto -x -k "$RUNNER_TEMP/hermeslink-components/HermesLink.app.zip" \
            "$RUNNER_TEMP/hermeslink-components/app"
          app="$(find "$RUNNER_TEMP/hermeslink-components/app" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app"
          /usr/bin/ditto "$app" "$RUNNER_TEMP/Payload/HermesLink.app"
          mkdir -p "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks"
          unzip -q "$RUNNER_TEMP/hermeslink-components/HermesRuntime.framework.zip" \
            -d "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks"
          unzip -q "$RUNNER_TEMP/hermeslink-components/ISHLinuxNative.zip" \
            -d "$RUNNER_TEMP/hermeslink-components"
          install -m 644 \
            "$RUNNER_TEMP/hermeslink-components/Resources/ish-rootfs.tar.gz" \
            "$RUNNER_TEMP/Payload/HermesLink.app/ish-rootfs.tar.gz"
          /usr/bin/ditto \
            "$RUNNER_TEMP/hermeslink-components/Frameworks/Ish.framework" \
            "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks/Ish.framework"
          install -m 644 "$RUNNER_TEMP/hermeslink-components/hermesrt.zip" \
            "$RUNNER_TEMP/Payload/HermesLink.app/hermesrt.zip"
          test -f "$RUNNER_TEMP/Payload/HermesLink.app/Info.plist"
          test -x "$RUNNER_TEMP/Payload/HermesLink.app/HermesLink"
          test -x "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks/Ish.framework/Ish"
          test -x "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks/HermesRuntime.framework/HermesRuntime"
          test -s "$RUNNER_TEMP/Payload/HermesLink.app/hermesrt.zip"
          python3 scripts/hermes/build/verify-ish-source.py \
            --rootfs "$RUNNER_TEMP/Payload/HermesLink.app/ish-rootfs.tar.gz"

      - name: Set IPA build number
        id: ipa_build_number
        env:
          HERMESLINK_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Payload/HermesLink.app"
          python3 scripts/hermes/build/set-ipa-build-number.py \
            "$app/Info.plist" "$HERMESLINK_BUILD_NUMBER"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          test "$actual" = "$HERMESLINK_BUILD_NUMBER"
          printf 'Verified IPA CFBundleVersion=%s\n' "$actual"
          printf 'version=%s\n' "$actual" >> "$GITHUB_OUTPUT"

      - name: Sign and package IPA
        env:
          EXPECTED_IPA_BUILD_NUMBER: ${{ steps.ipa_build_number.outputs.version }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Payload/HermesLink.app"
          codesign --force --sign - --timestamp=none "$app/Frameworks/Ish.framework"
          codesign --force --sign - --timestamp=none "$app/Frameworks/HermesRuntime.framework"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          rm -f "$RUNNER_TEMP/HermesLink.ipa"
          (cd "$RUNNER_TEMP" && /usr/bin/zip -qry -X HermesLink.ipa Payload)
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Info.plist'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/HermesLink'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/hermesrt.zip'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/ish-rootfs.tar.gz'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Frameworks/HermesRuntime.framework/HermesRuntime'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Frameworks/Ish.framework/Ish'
          unzip -p "$RUNNER_TEMP/HermesLink.ipa" Payload/HermesLink.app/Info.plist > "$RUNNER_TEMP/ipa-Info.plist"
          packaged_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/ipa-Info.plist")"
          test "$packaged_version" = "$EXPECTED_IPA_BUILD_NUMBER"
          printf 'Verified packaged IPA CFBundleVersion=%s\n' "$packaged_version"

      - name: Upload universal HermesLink IPA
        uses: actions/upload-artifact@v7
        with:
          name: hermeslink-ipa
          path: ${{ runner.temp }}/HermesLink.ipa
          if-no-files-found: error
          retention-days: 14
