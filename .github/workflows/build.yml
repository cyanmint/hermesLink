name: Build HermesLink

on:
  push:
  workflow_dispatch:
    inputs:
      python_runtime:
        description: Build and publish hermesrt.zip (Linux)
        required: true
        type: choice
        options: [auto, true, false]
        default: auto
      native_runtime:
        description: Build and publish HermesRuntime.framework (macOS)
        required: true
        type: choice
        options: [auto, true, false]
        default: auto
      app:
        description: Build HermesLink.app without runtime assets (macOS)
        required: true
        type: choice
        options: [auto, true, false]
        default: auto
      run_tests:
        description: Run simulator tests; Copilot E2E runs after IPA upload
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

# Components share one mutable release tag. Serialize runs so assets cannot be
# replaced while another run is assembling an IPA from that release.
concurrency:
  group: hermeslink-${{ github.ref }}
  cancel-in-progress: false

env:
  HERMES_RUNTIME_RELEASE_TAG: hermesrt-latest

jobs:
  decide:
    name: Decide build stages
    runs-on: ubuntu-latest
    outputs:
      run_python_runtime: ${{ steps.decision.outputs.run_python_runtime }}
      run_native_runtime: ${{ steps.decision.outputs.run_native_runtime }}
      run_app: ${{ steps.decision.outputs.run_app }}
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed components
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PYTHON_RUNTIME_OVERRIDE: ${{ inputs.python_runtime || 'auto' }}
          NATIVE_RUNTIME_OVERRIDE: ${{ inputs.native_runtime || 'auto' }}
          APP_OVERRIDE: ${{ inputs.app || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed_files=''
          else
            # Use the files listed in this push event. This covers every commit
            # included in the push, rather than inspecting only HEAD^.
            changed_files="$(jq -r '.commits[]? | (.added[]?, .modified[]?, .removed[]?)' "$EVENT_PATH")"
            # GitHub may omit the commit list for an unusually large push.
            # In that case, compare the push's before/after range, not one commit.
            if [ -z "$changed_files" ] && [ -n "$BEFORE_SHA" ] && \
               [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" 2>/dev/null || \
                git diff --name-only HEAD^ HEAD)"
            fi
          fi

          python_runtime_changed=false
          native_runtime_changed=false
          app_changed=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              hermes/build/build-hermesrt-zip.sh|hermes/build/fetch-sources.sh|hermes/build/validate-runtime-zip.py|hermes/overlay/hermes/*|hermes/overlay/patches/*|hermes/overlay/python/*|hermes/build/external/SOURCES)
                python_runtime_changed=true
                ;;
            esac
            case "$path" in
              hermes/build/build-native-ios.sh|hermes/build/package-native-ios.sh|hermes/overlay/cpython/*|hermes/patches/*|hermes/build/generate-native-module-registry.py|hermes/build/configure_native_modules.py)
                native_runtime_changed=true
                ;;
            esac
            case "$path" in
              Blink*/*|AppKitBridge/*|Common/*|DarkAppIcon/*|KB/*|SSH/*|SSHTests/*|Settings/*|Sessions/*|Resources/*|Media.xcassets/*|Frameworks/*|xcfs/*|*.xcodeproj/*|*.xcconfig|get_frameworks.sh|get_resources.sh|files_header.sh|header|ios_patches.h|ios_patches.m|main.m|template_setup.xcconfig|update_cacert.sh|install_hermes_runtime.sh)
                app_changed=true
                ;;
            esac
            if [[ "$path" == .github/workflows/* ]]; then
              python_runtime_changed=true
              native_runtime_changed=true
              app_changed=true
            fi
          done <<< "$changed_files"

          # Build missing release components once when bootstrapping this flow.
          if ! release_assets="$(gh release view "$HERMES_RUNTIME_RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            release_assets=''
          fi
          has_asset() { printf '%s\n' "$release_assets" | grep -Fxq "$1"; }
          has_asset hermesrt.zip || python_runtime_changed=true
          has_asset HermesRuntime.framework.zip || native_runtime_changed=true
          has_asset HermesLink.app.zip || app_changed=true

          choose() {
            case "$1" in
              true) printf 'true' ;;
              false) printf 'false' ;;
              auto) printf '%s' "$2" ;;
              *) echo "invalid override: $1" >&2; exit 2 ;;
            esac
          }
          run_python_runtime="$(choose "$PYTHON_RUNTIME_OVERRIDE" "$python_runtime_changed")"
          run_native_runtime="$(choose "$NATIVE_RUNTIME_OVERRIDE" "$native_runtime_changed")"
          run_app="$(choose "$APP_OVERRIDE" "$app_changed")"
          printf 'python_runtime_changed=%s native_runtime_changed=%s app_changed=%s\n' \
            "$python_runtime_changed" "$native_runtime_changed" "$app_changed"
          printf 'run_python_runtime=%s\n' "$run_python_runtime" >> "$GITHUB_OUTPUT"
          printf 'run_native_runtime=%s\n' "$run_native_runtime" >> "$GITHUB_OUTPUT"
          printf 'run_app=%s\n' "$run_app" >> "$GITHUB_OUTPUT"
          printf 'run_python_runtime=%s run_native_runtime=%s run_app=%s\n' "$run_python_runtime" "$run_native_runtime" "$run_app"

  prepare-release:
    name: Ensure runtime release exists
    needs: decide
    if: needs.decide.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Create fixed release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$HERMES_RUNTIME_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$HERMES_RUNTIME_RELEASE_TAG" \
              --title 'HermesLink build components (latest)' \
              --notes 'Build components used to assemble HermesLink.ipa.'
          fi

  build-runtime-zip:
    name: Build pure-Python hermesrt.zip (Linux)
    needs: [decide, prepare-release]
    if: needs.decide.outputs.run_python_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Set up host Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Build and validate pure-Python runtime archive
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/python-runtime
          CPYTHON_ROOT: ${{ runner.temp }}/hermes-build/cpython
          CPYTHON_REF: v3.13.9
        run: |
          set -euo pipefail
          chmod +x hermes/build/*.sh
          bash hermes/build/build-hermesrt-zip.sh
          test -s hermes/hermesrt.zip
          python3 hermes/build/validate-runtime-zip.py hermes/hermesrt.zip

      - name: Publish hermesrt.zip to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$HERMES_RUNTIME_RELEASE_TAG" hermes/hermesrt.zip --clobber

  build-native-runtime:
    name: Build native iOS runtime (macOS)
    needs: [decide, prepare-release]
    if: needs.decide.outputs.run_native_runtime == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Cache Hermes compilation
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hermes-build/native-ios
          key: ${{ runner.os }}-hermes-ios-${{ hashFiles('hermes/build/*.sh', 'hermes/build/*.py', 'hermes/overlay/**', 'hermes/patches/**') }}
          restore-keys: |
            ${{ runner.os }}-hermes-ios-

      - name: Build native iOS runtime only
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
          HERMES_BUILD_RUNTIME_ZIP: '0'
          JOBS: 4
        run: |
          set -euo pipefail
          chmod +x hermes/build/*.sh
          bash hermes/build/build-native-ios.sh
          test -x hermes/Frameworks/HermesRuntime.framework/HermesRuntime

      - name: Package native framework
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            hermes/Frameworks/HermesRuntime.framework \
            hermes/HermesRuntime.framework.zip
          unzip -t hermes/HermesRuntime.framework.zip

      - name: Publish HermesRuntime.framework.zip to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$HERMES_RUNTIME_RELEASE_TAG" hermes/HermesRuntime.framework.zip --clobber

  build-app:
    name: Build HermesLink app without hermesrt.zip & native HermesRuntime.framework (macOS)
    needs: [decide, prepare-release]
    if: needs.decide.outputs.run_app == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Prepare link-only runtime placeholders
        run: |
          set -euo pipefail
          mkdir -p Frameworks/HermesRuntime.framework Resources
          cat > "$RUNNER_TEMP/hermes_runtime_stub.c" <<'EOF'
          int hermes_runtime_main(int argc, char **argv) {
            (void)argc;
            (void)argv;
            return 70;
          }
          EOF
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios16.1 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -dynamiclib "$RUNNER_TEMP/hermes_runtime_stub.c" \
            -install_name '@rpath/HermesRuntime.framework/HermesRuntime' \
            -o Frameworks/HermesRuntime.framework/HermesRuntime
          cat > Frameworks/HermesRuntime.framework/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>HermesRuntime</string>
            <key>CFBundleIdentifier</key><string>com.cyan.hermes-runtime-link-stub</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
          </dict></plist>
          EOF
          printf 'runtime omitted from app component\n' > "$RUNNER_TEMP/runtime-stub.txt"
          (cd "$RUNNER_TEMP" && zip -q "$GITHUB_WORKSPACE/Resources/hermesrt.zip" runtime-stub.txt)

      - name: Set runtime-free app cache key
        id: runtime_hash
        run: echo 'sha256=runtime-free' >> "$GITHUB_OUTPUT"

      - name: Cache unsigned app archive
        id: app_build_cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/HermesLink.xcarchive
            ${{ runner.temp }}/hermeslink-archive.log
          key: ${{ runner.os }}-hermes-app-${{ github.sha }}-${{ steps.runtime_hash.outputs.sha256 }}-${{ hashFiles('Blink.xcodeproj/**', 'Blink/**', 'Settings/**', 'Sessions/**', 'Resources/**', 'Media.xcassets/**', 'Frameworks/**', '*.xcconfig', 'hermes/build/**', 'install_hermes_runtime.sh') }}

      - name: Cache framework builds
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_frameworks.sh

      - name: Get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_resources.sh

      - name: Prepare Xcode configuration
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Run HermesLink tests
        if: ${{ inputs.run_tests == true }}
        continue-on-error: true
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | grep -m1 -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')"
          test -n "$simulator_id"
          set -o pipefail
          xcodebuild -project Blink.xcodeproj -scheme BlinkTests -sdk iphonesimulator -destination "id=$simulator_id" test | xcpretty

      - name: Build unsigned device archive
        if: steps.app_build_cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath "$RUNNER_TEMP/HermesLink.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET='16.1' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | tee "$RUNNER_TEMP/hermeslink-archive.log" | xcpretty

      - name: Validate cached unsigned device archive
        if: steps.app_build_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications"
          test -n "$(find "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"

      - name: Remove link-only runtime placeholders
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          rm -rf "$app/Frameworks/HermesRuntime.framework" "$app/hermesrt.zip"
          test ! -e "$app/Frameworks/HermesRuntime.framework"
          test ! -e "$app/hermesrt.zip"

      - name: Package and publish runtime-free app
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -f "$app/Info.plist"
          test -x "$app/HermesLink"
          mkdir -p "$RUNNER_TEMP/runtime-free-app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" \
            "$RUNNER_TEMP/runtime-free-app/HermesLink.app.zip"
          if unzip -Z1 "$RUNNER_TEMP/runtime-free-app/HermesLink.app.zip" | grep -E 'HermesRuntime\.framework|hermesrt\.zip'; then
            echo "runtime-free app unexpectedly contains Hermes runtime assets" >&2
            exit 1
          fi
          GH_TOKEN="${{ github.token }}" gh release upload "$HERMES_RUNTIME_RELEASE_TAG" \
            "$RUNNER_TEMP/runtime-free-app/HermesLink.app.zip" --clobber

  simulator-e2e:
    name: Simulator Copilot E2E
    needs: [decide, prepare-release, build-runtime-zip, build-native-runtime, build-app]
    if: >-
      always() &&
      inputs.run_tests == true &&
      needs.prepare-release.result == 'success' &&
      needs.build-app.result == 'success' &&
      (needs.build-runtime-zip.result == 'success' || needs.build-runtime-zip.result == 'skipped') &&
      (needs.build-native-runtime.result == 'success' || needs.build-native-runtime.result == 'skipped')
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install released runtime for simulator Copilot E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-e2e"
          gh release download "$HERMES_RUNTIME_RELEASE_TAG" \
            --pattern hermesrt.zip \
            --pattern HermesRuntime.framework.zip \
            --dir "$RUNNER_TEMP/runtime-e2e"
          python3 hermes/build/validate-runtime-zip.py "$RUNNER_TEMP/runtime-e2e/hermesrt.zip"
          unzip -t "$RUNNER_TEMP/runtime-e2e/HermesRuntime.framework.zip"
          mkdir -p hermes/Frameworks
          unzip -q "$RUNNER_TEMP/runtime-e2e/HermesRuntime.framework.zip" -d hermes/Frameworks
          cp "$RUNNER_TEMP/runtime-e2e/hermesrt.zip" hermes/hermesrt.zip
          bash install_hermes_runtime.sh hermes

      - name: Cache framework builds
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_frameworks.sh

      - name: Get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_resources.sh

      - name: Prepare Xcode configuration
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build HermesLink simulator app
        continue-on-error: true
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/HermesLinkSimulatorE2E" \
            IPHONEOS_DEPLOYMENT_TARGET='16.1' \
            CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/hermeslink-simulator-e2e-build.log" | xcpretty
          test -d "$RUNNER_TEMP/HermesLinkSimulatorE2E/Build/Products/Debug-iphonesimulator/Blink.app"

      - name: Run Copilot WebUI conversation in simulator
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SIMULATOR_APP_PATH: ${{ runner.temp }}/HermesLinkSimulatorE2E/Build/Products/Debug-iphonesimulator/HermesLink.app
        run: |
          set -euo pipefail
          set -o pipefail
          python hermes/tests/ci_simulator_copilot_e2e.py 2>&1 | tee "$RUNNER_TEMP/hermeslink-simulator-copilot-e2e.log"

      - name: Upload simulator Copilot E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermeslink-simulator-copilot-e2e-logs
          path: |
            ${{ runner.temp }}/hermeslink-simulator-e2e-build.log
            ${{ runner.temp }}/hermeslink-simulator-copilot-e2e.log
          if-no-files-found: ignore
          retention-days: 14

  assemble-ipa:
    name: Assemble HermesLink IPA
    needs: [decide, prepare-release, build-runtime-zip, build-native-runtime, build-app]
    if: always()
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v7

      - name: Download app and runtime components from fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermeslink-components/app" "$RUNNER_TEMP/Payload"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${HERMES_RUNTIME_RELEASE_TAG}"
          for asset in HermesLink.app.zip HermesRuntime.framework.zip hermesrt.zip; do
            curl --fail --location --retry 5 --retry-all-errors \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/octet-stream' \
              --output "$RUNNER_TEMP/hermeslink-components/$asset" \
              "$release_url/$asset"
            test -s "$RUNNER_TEMP/hermeslink-components/$asset"
          done
          unzip -t "$RUNNER_TEMP/hermeslink-components/HermesLink.app.zip"
          python3 hermes/build/validate-runtime-zip.py "$RUNNER_TEMP/hermeslink-components/hermesrt.zip"
          unzip -t "$RUNNER_TEMP/hermeslink-components/HermesRuntime.framework.zip"
          ditto -x -k "$RUNNER_TEMP/hermeslink-components/HermesLink.app.zip" \
            "$RUNNER_TEMP/hermeslink-components/app"
          app="$(find "$RUNNER_TEMP/hermeslink-components/app" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app"
          /usr/bin/ditto "$app" "$RUNNER_TEMP/Payload/HermesLink.app"
          mkdir -p "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks"
          unzip -q "$RUNNER_TEMP/hermeslink-components/HermesRuntime.framework.zip" \
            -d "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks"
          install -m 644 "$RUNNER_TEMP/hermeslink-components/hermesrt.zip" \
            "$RUNNER_TEMP/Payload/HermesLink.app/hermesrt.zip"
          test -f "$RUNNER_TEMP/Payload/HermesLink.app/Info.plist"
          test -x "$RUNNER_TEMP/Payload/HermesLink.app/HermesLink"
          test -x "$RUNNER_TEMP/Payload/HermesLink.app/Frameworks/HermesRuntime.framework/HermesRuntime"
          test -s "$RUNNER_TEMP/Payload/HermesLink.app/hermesrt.zip"

      - name: Sign and package IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Payload/HermesLink.app"
          codesign --force --sign - --timestamp=none "$app/Frameworks/HermesRuntime.framework"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          rm -f "$RUNNER_TEMP/HermesLink.ipa"
          (cd "$RUNNER_TEMP" && /usr/bin/zip -qry -X HermesLink.ipa Payload)
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Info.plist'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/HermesLink'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/hermesrt.zip'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Frameworks/HermesRuntime.framework/HermesRuntime'

      - name: Upload universal HermesLink IPA
        uses: actions/upload-artifact@v7
        with:
          name: hermeslink-ipa
          path: ${{ runner.temp }}/HermesLink.ipa
          if-no-files-found: error
          retention-days: 14
